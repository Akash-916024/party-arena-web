<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Party Arena Web — Play multiplayer mini-games online with friends. Create or join party rooms and compete in Pong, Tic-Tac-Toe, Reaction Speed, Connect Four, and Memory Match.">
  <meta name="theme-color" content="#1A1A2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Party Arena Web — Multiplayer Mini-Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
  <!-- ═══ App Shell ═══ -->
  <div id="app">
    <!-- Dynamic content rendered by JS -->
  </div>

  <!-- ═══ Toast Container ═══ -->
  <div id="toast-container"></div>

  <!-- ═══ Modal Overlay ═══ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- ═══ Countdown Overlay ═══ -->
  <div id="countdown-overlay" class="countdown-overlay hidden">
    <div class="countdown-number" id="countdown-number"></div>
  </div>

  <!-- ═══ Scripts ═══ -->
  <script src="js/audio.js"></script>
  <script src="js/network.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reactions.js"></script>
  <script src="js/room.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/games/base-game.js"></script>
  <script src="js/games/pong.js"></script>
  <script src="js/games/tic-tac-toe.js"></script>
  <script src="js/games/reaction.js"></script>
  <script src="js/games/connect-four.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/tug-of-war.js"></script>
  <script src="js/games/bomb-tag.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
